name: GitHub CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types:
      - released
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    defaults:
        run:
          shell: pwsh
    strategy:
      matrix:
        platform: [netframework, net, net-x86, net-x64]
        include:
          - platform: netframework
            package-name: netframework
            build-dir: net48
          - platform: net
            package-name: net
            build-dir: net10.0-windows
          - platform: net-x86
            package-name: net-win32
            build-dir: net10.0-windows\win-x86\publish
          - platform: net-x64
            package-name: net-win64
            build-dir: net10.0-windows\win-x64\publish

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - uses: microsoft/setup-msbuild@v3.0.0

      - name: Build dnSpy (${{matrix.platform}})
        run: .\build.ps1 ${{matrix.platform}}

      - name: Create output directory
        run: New-Item -ItemType Directory -Path C:\builtfiles\dnSpy-${{matrix.platform}} -Force > $null
        continue-on-error: true

      - name:  Copy release files for upload
        run: Copy-Item -Path dnSpy\dnSpy\bin\Release\${{matrix.build-dir}}\* -Destination C:\builtfiles\dnSpy-${{matrix.platform}} -Recurse

      - uses: actions/upload-artifact@v7.0.2
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          name: dnSpy-${{matrix.package-name}}
          path: C:\builtfiles\dnSpy-${{matrix.platform}}
          if-no-files-found: error
          compression-level: 9

  build-console:
    name: Build console (${{matrix.rid}})
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 'smoke-test' is false when the runner can't execute that RID
          - os: ubuntu-latest
            rid: linux-x64
            smoke-test: true
          - os: ubuntu-latest
            rid: linux-arm64
            smoke-test: false
          - os: ubuntu-latest
            rid: linux-musl-x64
            smoke-test: false
          # osx-* must be published on macOS so the apphost gets signed
          - os: macos-latest
            rid: osx-arm64
            smoke-test: true
          - os: macos-latest
            rid: osx-x64
            smoke-test: false
          - os: windows-latest
            rid: win-x64
            smoke-test: true
          - os: windows-latest
            rid: win-x86
            smoke-test: true
          - os: windows-latest
            rid: win-arm64
            smoke-test: false

    env:
      PUBLISH_DIR: dnSpy/dnSpy/bin/Release/net10.0/${{matrix.rid}}/publish

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Publish dnSpy.Console (${{matrix.rid}})
        if: runner.os != 'Windows'
        run: ./build.sh publish ${{matrix.rid}}

      - name: Publish dnSpy.Console (${{matrix.rid}})
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build.ps1 console -Rid ${{matrix.rid}}

      - name: Smoke test
        if: matrix.smoke-test
        shell: bash
        run: |
          "${{env.PUBLISH_DIR}}/dnSpy.Console" --type dnlib.DotNet.UTF8String "${{env.PUBLISH_DIR}}/dnlib.dll" > smoke-test.cs
          grep -q "class UTF8String" smoke-test.cs

      # Upload a tarball on Linux/macOS since artifacts don't keep the executable bit
      - name: Create tarball
        if: runner.os != 'Windows'
        run: tar -C "${{env.PUBLISH_DIR}}" -czf dnSpy-console-${{matrix.rid}}.tar.gz .

      - uses: actions/upload-artifact@v7.0.2
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          name: dnSpy-console-${{matrix.rid}}
          path: ${{runner.os == 'Windows' && env.PUBLISH_DIR || format('dnSpy-console-{0}.tar.gz', matrix.rid)}}
          if-no-files-found: error
          compression-level: ${{runner.os == 'Windows' && 9 || 0}}

  build-console-portable:
    name: Build console (portable)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Build dnSpy.Console (net10.0)
        run: ./build.sh console

      - name: Smoke test
        run: |
          dotnet dnSpy/dnSpy/bin/Release/net10.0/dnSpy.Console.dll --type dnlib.DotNet.UTF8String dnSpy/dnSpy/bin/Release/net10.0/dnlib.dll > smoke-test.cs
          grep -q "class UTF8String" smoke-test.cs

      - uses: actions/upload-artifact@v7.0.2
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          name: dnSpy-console-net
          path: dnSpy/dnSpy/bin/Release/net10.0
          if-no-files-found: error
          compression-level: 9

      # After the upload so the dnSpy-console-net artifact doesn't include it
      - name: Build dnSpy.Avalonia (net10.0)
        run: ./build.sh avalonia

      - name: Smoke test dnSpy.Avalonia
        run: ./build.sh avalonia-test --screenshots avalonia-screenshots

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: dnSpy-avalonia-smoke-test-screenshots
          path: avalonia-screenshots
          if-no-files-found: ignore
